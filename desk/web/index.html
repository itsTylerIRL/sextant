<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sextant</title>
  <link rel="icon" type="image/png" href="/apps/sextant/icon">
  <link rel="stylesheet" href="/apps/sextant/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><img src="/apps/sextant/icon" alt="" width="26" height="26">SEXTANT</a>
    <nav class="tabs">
      <a href="#/" data-tab="net">Network</a>
      <a href="#/pals" data-tab="pals">Pals</a>
      <a href="#/peers" data-tab="peers">Peers</a>
    </nav>
    <form id="search" autocomplete="off">
      <input id="q" placeholder="~sampel-palnet" spellcheck="false" aria-label="Go to ship">
    </form>
    <span id="host" class="host"></span>
  </header>
  <nav id="crumbs" class="crumbs"></nav>
  <main id="main">
    <div class="explore" id="explore">
      <section class="stage" id="stage">
        <canvas id="sky" aria-label="Map of the Urbit network. The list beside it has the same ships as text." role="img"></canvas>
        <div class="hud title" id="title"></div>
        <div class="hud zoom">
          <button data-z="in" aria-label="Zoom in">+</button>
          <button data-z="out" aria-label="Zoom out">−</button>
          <button data-z="reset" aria-label="Reset view">⌂</button>
        </div>
        <div class="hud scanhud" id="scanhud">
          <button id="scanbtn">Scan view</button>
          <div class="bar" hidden><i id="scanbar"></i></div>
          <span id="scanres"></span>
        </div>
        <div class="hud legend" id="legend"></div>
        <div class="hud hint" id="hint">scroll to zoom · drag to pan · click to select · click again to zoom in · esc to go up</div>
        <div class="loading" id="loading" hidden>reading azimuth…</div>
        <div class="tip" id="tip" hidden></div>
      </section>
      <div class="side">
        <aside class="panel card" id="panel"></aside>
        <section class="card listcard" id="list"></section>
      </div>
    </div>
    <div id="view" hidden></div>
  </main>
  <script src="/apps/sextant/sigil.js"></script>
  <script src="/apps/sextant/app.js"></script>
</body>
</html>
